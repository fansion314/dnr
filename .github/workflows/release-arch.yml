name: Release Arch packages

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: release-arch-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build ${{ matrix.package }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        package: [dnr, dnr-cef, dnr-webview, dnc]
    steps:
      - name: Check out the tagged commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Free space on the disposable hosted runner
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h /

      - name: Restore Cargo downloads
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ${{ runner.temp }}/dnr-cache/cargo
          key: arch-cargo-${{ matrix.package }}-${{ hashFiles('Cargo.lock', 'integration/deno.Cargo.lock') }}
          restore-keys: arch-cargo-${{ matrix.package }}-

      - name: Build and test in the official Arch image
        env:
          PACKAGE: ${{ matrix.package }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          mkdir -p "$RUNNER_TEMP/dnr-cache" dist/release
          docker pull ghcr.io/archlinux/archlinux:base-devel
          docker image inspect ghcr.io/archlinux/archlinux:base-devel \
            --format '{{json .RepoDigests}}' > "dist/release/$PACKAGE-container-image.txt"
          docker run --rm \
            --volume "$PWD:/work" \
            --volume "$RUNNER_TEMP/dnr-cache:/cache" \
            --env "DNR_BUILD_UID=$(id -u)" \
            --workdir /work \
            ghcr.io/archlinux/archlinux:base-devel \
            bash scripts/ci/build-arch.sh "$PACKAGE" "$RELEASE_TAG" "$RELEASE_COMMIT" \
            2>&1 | tee "dist/$PACKAGE-build.log"

      - name: Upload the tested package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: arch-${{ matrix.package }}
          path: dist/release/*
          if-no-files-found: error
          compression-level: 0

      - name: Preserve build logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: log-${{ matrix.package }}
          path: dist/*-build.log
          if-no-files-found: ignore

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: arch-*
          path: release-assets
          merge-multiple: true
      - name: Publish all runtimes, standalone dnc and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/publish-arch.sh
