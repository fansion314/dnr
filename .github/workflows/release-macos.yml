name: Release macOS package

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  # Empty input: build (and publish on tags). Nonempty: sync an existing release's tap only.
  workflow_dispatch:
    inputs:
      tap_release:
        description: 'Existing release tag to install-test and sync to Formula/dnr.rb without rebuilding (e.g. v0.4.2)'
        type: string
        default: ''

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: release-macos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build dnr (WebView) and dnc
    if: github.event_name != 'workflow_dispatch' || inputs.tap_release == ''
    runs-on: macos-15
    timeout-minutes: 180
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_RELEASE_DEBUG: '0'
      MACOSX_DEPLOYMENT_TARGET: '15.0'
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check native ARM64 toolchain
        run: |
          test "$(uname -sm)" = 'Darwin arm64'
          xcodebuild -version
          brew list cmake >/dev/null 2>&1 || brew install cmake
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
          python3 --version
      - name: Restore Cargo and V8 downloads
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/.rusty_v8
          key: macos-arm64-downloads-${{ hashFiles('Cargo.lock', 'integration/deno.Cargo.lock') }}
          restore-keys: macos-arm64-downloads-
      - name: Check packaging helpers
        run: python3 -m unittest discover -s scripts/ci/tests -v
      - name: Build, test and package both tools
        run: |
          mkdir -p dist
          bash scripts/ci/build-macos.sh 2>&1 | tee dist/macos-build.log
      - name: Install and test the archive through Homebrew
        run: |
          bash scripts/ci/test-homebrew.sh dist/macos-release/dnr.rb \
            dist/macos-release/dnr-*-macos-arm64.tar.gz
      - name: Upload tested package and formula
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-arm64
          path: dist/macos-release/*
          if-no-files-found: error
          compression-level: 0
      - name: Preserve build log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-build-log
          path: dist/macos-build.log
          if-no-files-found: ignore

  release:
    name: Publish macOS release assets
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: release-publish-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: macos-arm64
          path: release-assets
      - name: Publish immutable macOS package and checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/publish-macos.sh

  homebrew:
    name: Verify release download and update repository tap
    needs: release
    if: always() && (needs.release.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.tap_release != ''))
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: write
    concurrency:
      group: homebrew-tap
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch the published archive and generate the pinned formula
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tap_release || github.ref_name }}
        run: |
          [[ $RELEASE_TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          test "$(gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json isDraft,isPrerelease --jq '(.isDraft or .isPrerelease) | not')" = true
          version=${RELEASE_TAG#v}
          archive="dnr-$version-macos-arm64.tar.gz"
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "$archive" --pattern "$archive.sha256" --dir release-assets
          (cd release-assets && shasum -a 256 --check "$archive.sha256")
          python3 scripts/ci/homebrew.py render "$GITHUB_REPOSITORY" "$version" \
            "release-assets/$archive" release-assets/dnr.rb
      - name: Test installation from the public Release URL
        run: bash scripts/ci/test-homebrew.sh release-assets/dnr.rb
      - name: Commit Formula/dnr.rb to this repository's default branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/homebrew.py update "$GITHUB_REPOSITORY" release-assets/dnr.rb
