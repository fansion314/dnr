name: Release macOS package

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  # Branch dispatches validate/build only. A dispatch on a release tag publishes.
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: release-macos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build dnr (WebView) and dnc
    runs-on: macos-15
    timeout-minutes: 180
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_RELEASE_DEBUG: '0'
      MACOSX_DEPLOYMENT_TARGET: '15.0'
      HOMEBREW_NO_AUTO_UPDATE: '1'
      HOMEBREW_NO_INSTALL_CLEANUP: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check native ARM64 toolchain
        run: |
          test "$(uname -sm)" = 'Darwin arm64'
          xcodebuild -version
          brew list cmake >/dev/null 2>&1 || brew install cmake
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustc --version
          python3 --version
      - name: Restore Cargo and V8 downloads
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/.rusty_v8
          key: macos-arm64-downloads-${{ hashFiles('Cargo.lock', 'integration/deno.Cargo.lock') }}
          restore-keys: macos-arm64-downloads-
      - name: Check packaging helpers
        run: python3 -m unittest discover -s scripts/ci/tests -v
      - name: Build, test and package both tools
        run: |
          mkdir -p dist
          bash scripts/ci/build-macos.sh 2>&1 | tee dist/macos-build.log
      - name: Install and test the archive through Homebrew
        run: |
          bash scripts/ci/test-homebrew.sh dist/macos-release/dnr.rb \
            dist/macos-release/dnr-*-macos-arm64.tar.gz
      - name: Upload tested package and formula
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-arm64
          path: dist/macos-release/*
          if-no-files-found: error
          compression-level: 0
      - name: Preserve build log
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: macos-build-log
          path: dist/macos-build.log
          if-no-files-found: ignore

  release:
    name: Publish macOS release assets
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: release-publish-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: macos-arm64
          path: release-assets
      - name: Publish immutable macOS package and checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/publish-macos.sh
      - name: Explain tap setup when disabled
        if: vars.HOMEBREW_TAP == ''
        run: echo 'Tap update disabled. Configure HOMEBREW_TAP and HOMEBREW_TAP_DEPLOY_KEY as described in docs/MACOS-RELEASE.md.' >> "$GITHUB_STEP_SUMMARY"

  homebrew:
    name: Verify release download and update tap
    needs: release
    if: vars.HOMEBREW_TAP != ''
    runs-on: macos-15
    timeout-minutes: 20
    concurrency:
      group: homebrew-tap
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: macos-arm64
          path: release-assets
      - name: Test installation from the public Release URL
        run: bash scripts/ci/test-homebrew.sh release-assets/dnr.rb
      - name: Update the dedicated tap
        env:
          TAP_DEPLOY_KEY: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          HOMEBREW_TAP: ${{ vars.HOMEBREW_TAP }}
        run: |
          test -n "$TAP_DEPLOY_KEY" || { echo 'Missing HOMEBREW_TAP_DEPLOY_KEY secret' >&2; exit 1; }
          key_file=$(mktemp "$RUNNER_TEMP/dnr-tap-key.XXXXXX")
          known_hosts=$(mktemp "$RUNNER_TEMP/dnr-known-hosts.XXXXXX")
          trap 'rm -f "$key_file" "$known_hosts"' EXIT
          chmod 600 "$key_file"
          printf '%s\n' "$TAP_DEPLOY_KEY" > "$key_file"
          # Fetch GitHub's host keys over authenticated HTTPS, not unverified ssh-keyscan.
          curl --fail --silent --show-error https://api.github.com/meta |
            python3 -c 'import json, sys; print("\n".join("github.com " + key for key in json.load(sys.stdin)["ssh_keys"]))' > "$known_hosts"
          export GIT_SSH_COMMAND="ssh -i $key_file -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o UserKnownHostsFile=$known_hosts"
          python3 scripts/ci/homebrew.py update-git "$HOMEBREW_TAP" release-assets/dnr.rb
