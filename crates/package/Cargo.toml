[package]
name = "dnr-package"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Application package format, virtual filesystem, and decompression cache for dnr"
readme.workspace = true
license.workspace = true
keywords = ["deno", "zip", "vfs", "packaging", "zstd"]
categories = ["filesystem", "compression"]

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
zip.workspace = true
sha2 = "0.10.9"
globset = "0.4.18"
crc32fast = "1.5.0"
rusqlite = { version = "0.40.0", features = ["bundled", "fallible_uint"] }

# sha2 0.10 gates AArch64's runtime-detected hardware backend behind asm.
# x86_64 already selects its accelerated backend without this feature.
[target.'cfg(target_arch = "aarch64")'.dependencies]
sha2 = { version = "0.10.9", features = ["asm"] }
